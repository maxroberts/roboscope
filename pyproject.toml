[project]
name = "roboscope"
version = "0.1.0"
description = "Self-calibrating, camera-guided control for a Meade StarNavigator NG (AudioStar) telescope"
authors = [
    { name = "maxroberts", email = "thomasmaxroberts@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pgeocode>=0.5.0",
    "pyserial>=3.5",
    "simplejpeg>=1.10.1",
    "skyfield>=1.55",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
