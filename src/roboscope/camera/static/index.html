<!doctype html>
<!--
  roboscope camera viewer, served by roboscope.camera.server at "/".
  Shows the MJPEG preview (scaled to the panel width, so a reduced preview_size stays
  large on screen), lets the user change CameraSettings (POST /api/settings),
  run a star locate (GET /api/locate), download a snapshot or a raw .npy frame, and
  polls /api/status every 2 s. With a mount (server --mount; GET /api/mount answers),
  a Mount panel steers it: hold ▲▼◀▶ or the arrow keys to move, release to stop
  (200 ms jog heartbeats; the server stops an axis 0.6 s after the last one, so a
  closed tab or lost network stops it too). ■, Space or Esc stops both axes; leaving
  the tab or window stops them as well. Speed in °/s, default from the server, clamped
  there to each axis's maximum. The presets are the AudioStar handbox's speeds 1–8,
  from the NG manual's "Slew Speeds" table (°/s). Positions are mount degrees from the controller's
  zero, not sky coordinates, and which way "+" turns each axis isn't verified yet. Two error lines: a rejected setting stays shown until
  the next accepted change; below it, the camera's current capture error (status
  last_error, empty once captures succeed again) or a failed status poll. When the server limits preview fps per preview size
  (status.max_preview_fps, the hub), the limit for the chosen size is shown next to
  the fps box, and the server clamps requests to it. Dark, dim-red theme ("night") by default to keep the
  observer's dark adaptation; the "day" toggle switches to a neutral theme.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>roboscope camera</title>
<style>
  :root { --bg:#000; --panel:#120000; --fg:#c33; --dim:#722; --line:#300; --accent:#f44; }
  body.day { --bg:#1b1d21; --panel:#25282d; --fg:#e6e6e6; --dim:#9aa0a6; --line:#3a3e44; --accent:#7fb2ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, sans-serif; }
  main { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:12px; padding:12px; }
  @media (max-width:900px) { main { grid-template-columns:1fr; } }
  .view { background:#000; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; min-height:300px; }
  .view img { width:100%; height:auto; image-rendering:pixelated; display:block; }
  body:not(.day) .view img { filter: sepia(1) saturate(6) hue-rotate(-50deg) brightness(.8); }
  aside { display:flex; flex-direction:column; gap:12px; }
  section { background:var(--panel); border:1px solid var(--line); padding:10px; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:0 0 8px; }
  label { display:grid; grid-template-columns:110px 1fr; align-items:center; gap:6px; margin:4px 0; }
  input, select, button { background:var(--bg); color:var(--fg); border:1px solid var(--line); padding:4px 6px; font:inherit; }
  input[type=range] { padding:0; accent-color:var(--accent); }
  button { cursor:pointer; } button:hover { border-color:var(--accent); }
  .row { display:flex; gap:6px; flex-wrap:wrap; }
  dl { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; margin:0; font-variant-numeric:tabular-nums; }
  dt { color:var(--dim); } dd { margin:0; text-align:right; }
  .err { color:var(--accent); white-space:pre-wrap; }
  a { color:var(--fg); }
  .pad { display:grid; grid-template-columns:repeat(3, 56px); grid-template-rows:repeat(3, 44px); gap:4px; justify-content:center; margin:6px 0; }
  .pad button { font-size:18px; touch-action:none; user-select:none; -webkit-user-select:none; }
  .pad button.held { background:var(--line); border-color:var(--accent); }
  #m_stop { color:var(--accent); font-weight:bold; }
</style>
</head>
<body>
<main>
  <div class="view"><img id="stream" src="/stream" alt="camera stream"></div>
  <aside>
    <section id="mount" hidden>
      <h2>Mount</h2>
      <div class="pad">
        <span></span><button data-axis="alt" data-dir="1" title="Alt + (↑ key)">▲</button><span></span>
        <button data-axis="az" data-dir="-1" title="Az − (← key)">◀</button>
        <button id="m_stop" title="stop both axes (Space or Esc)">■</button>
        <button data-axis="az" data-dir="1" title="Az + (→ key)">▶</button>
        <span></span><button data-axis="alt" data-dir="-1" title="Alt − (↓ key)">▼</button><span></span>
      </div>
      <label>Speed °/s <input id="m_speed" type="number" min="0.001" step="any"></label>
      <label>&nbsp;<select id="m_preset">
        <option value="">preset (handbox speed)…</option><option value="max">max (both axes)</option>
        <option value="1.5">8: 1.5</option><option value="1">7: 1</option><option value="0.5">6: 0.5</option>
        <option value="0.27">5: 0.27 (64×)</option><option value="0.067">4: 0.067 (16×)</option>
        <option value="0.033">3: 0.033 (8×)</option><option value="0.008">2: 0.008 (2×)</option>
        <option value="0.004">1: 0.004 (1× sidereal)</option></select></label>
      <dl id="m_status"></dl>
      <div class="row" style="margin-top:6px"><button id="m_cal" type="button">Calibrate encoders</button></div>
      <div id="m_set_error" class="err"></div>
      <div id="m_error" class="err"></div>
    </section>
    <section>
      <h2>Exposure</h2>
      <label>Mode <select id="mode"><option value="binned">binned 1296×972</option><option value="full">full 2592×1944</option></select></label>
      <label>Exposure ms <input id="exposure_ms" type="number" min="0.01" max="10000" step="any"></label>
      <label>&nbsp;<input id="exposure_log" type="range" min="-2" max="4" step="0.05" title="log scale, 0.01 ms – 10 s"></label>
      <label>Gain <input id="gain" type="number" min="1" max="64" step="0.1"></label>
    </section>
    <section>
      <h2>Display</h2>
      <label>Stretch <select id="stretch"><option value="auto">auto</option><option value="manual">manual</option></select></label>
      <label>Black <input id="black" type="number" step="any"></label>
      <label>White <input id="white" type="number" step="any"></label>
      <label>Crosshair <input id="crosshair" type="checkbox"></label>
      <label>Preview size <select id="preview_size"><option value="full">full</option><option value="half">half</option><option value="quarter">quarter</option></select></label>
      <label>Preview fps <input id="preview_fps" type="number" min="0.1" max="30" step="0.5"> <span id="fps_max"></span></label>
      <label>Theme <button id="theme" type="button">day</button></label>
    </section>
    <section>
      <h2>Actions</h2>
      <div class="row">
        <button id="locate" type="button">Locate star</button>
        <a href="/snapshot.jpg" download="snapshot.jpg"><button type="button">Snapshot</button></a>
        <a href="/api/frame.npy"><button type="button">Raw .npy</button></a>
      </div>
      <dl id="fix" style="margin-top:8px"></dl>
    </section>
    <section>
      <h2>Status</h2>
      <dl id="status"></dl>
      <div id="set_error" class="err"></div>
      <div id="error" class="err"></div>
    </section>
  </aside>
</main>
<script>
const $ = id => document.getElementById(id);
let mountOn = false;                // the server steers a mount (status.mount, 2 s poll)
const fields = ["mode","exposure_ms","gain","stretch","black","white","crosshair","preview_size","preview_fps"];

function show(s) {
  for (const k of fields) {
    const el = $(k); if (!el || document.activeElement === el) continue;
    if (el.type === "checkbox") el.checked = s[k]; else el.value = s[k];
  }
  if (document.activeElement !== $("exposure_log")) $("exposure_log").value = Math.log10(s.exposure_ms);
}
async function send(changes) {
  const r = await fetch("/api/settings", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(changes)});
  const j = await r.json();
  // Its own line: the status poll rewrites #error every 2 s and would hide this.
  if (!r.ok) { $("set_error").textContent = "setting rejected: " + j.error; return; }
  $("set_error").textContent = ""; show(j);
}
for (const k of fields) $(k).addEventListener("change", e => {
  const el = e.target, v = el.type === "checkbox" ? el.checked : (el.type === "number" ? Number(el.value) : el.value);
  send({[k]: v});
});
$("exposure_log").addEventListener("input", e => { $("exposure_ms").value = (10 ** Number(e.target.value)).toPrecision(3); });
$("exposure_log").addEventListener("change", e => send({exposure_ms: Number((10 ** Number(e.target.value)).toPrecision(3))}));

const fmt = (v, d=2) => typeof v === "number" ? (Number.isInteger(v) ? v : v.toFixed(d)) : (v ?? "–");
function list(el, obj) { el.innerHTML = Object.entries(obj).map(([k,v]) => `<dt>${k}</dt><dd>${fmt(v)}</dd>`).join(""); }

$("locate").addEventListener("click", async () => {
  $("locate").disabled = true; $("fix").innerHTML = "<dt>locating…</dt>";
  try {
    const r = await fetch("/api/locate"); const j = await r.json();
    if (!r.ok) list($("fix"), {error: j.error});
    else if (!j.found) list($("fix"), {found: "no star", frame: j.frame.seq});
    else list($("fix"), {x: j.x, y: j.y, snr: j.snr, flux: j.flux, peak: j.peak, npix: j.npix,
                         saturated: String(j.saturated), frame: j.frame.seq});
  } finally { $("locate").disabled = false; }
});
$("theme").addEventListener("click", () => {
  const day = document.body.classList.toggle("day");
  $("theme").textContent = day ? "night" : "day";
});
// Restart the stream if it stalls (e.g. server restart).
$("stream").addEventListener("error", () => setTimeout(() => $("stream").src = "/stream?" + Date.now(), 2000));

async function poll() {
  try {
    const s = await (await fetch("/api/status")).json();
    show(s.settings);
    const cap = s.max_preview_fps && s.max_preview_fps[s.settings.preview_size];
    $("fps_max").textContent = cap ? `max ${cap}` : "";
    $("preview_fps").max = cap || 30;
    const f = s.frame || {};
    list($("status"), {camera: s.info.model, "capture fps": s.fps, idle: String(s.idle), frame: f.seq, "age s": f.age_s,
      "exposure ms": f.exposure_us != null ? f.exposure_us / 1000 : null, gain: f.gain,
      background: f.background, noise: f.noise, max: f.max,
      "saturated %": f.saturated_fraction != null ? 100 * f.saturated_fraction : null,
      "CPU °C": s.temperature_c});
    $("error").textContent = s.last_error || "";
    if (s.mount !== mountOn) { mountOn = !!s.mount; $("mount").hidden = !mountOn; pollMount(); }
  } catch (e) { $("error").textContent = "status: " + e; }
}
poll(); setInterval(poll, 2000);

// ---- Mount panel (shown when the server has --mount) ----
// Hold a button (or an arrow key) to move; release stops. While held, a jog heartbeat
// goes out every 200 ms; the server stops an axis whose heartbeat is 0.6 s old, so a
// closed tab or dropped network also stops it. Speed is per page, default from the
// server (the fast end), clamped by the server to each axis's maximum.
const held = {};                    // axis -> {dir, timer}
let mountMax = null;
async function mpost(path, body) {
  const r = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body || {})});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error);
  return j;
}
function jogStart(axis, dir) {
  if (held[axis] && held[axis].dir === dir) return;
  if (held[axis]) clearInterval(held[axis].timer);
  const beat = () => mpost("/api/mount/jog", {axis, direction: dir, speed: Number($("m_speed").value)})
    .then(s => { $("m_set_error").textContent = ""; showMount(s); })
    .catch(e => { $("m_set_error").textContent = "move refused: " + e.message; });
  beat();
  held[axis] = {dir, timer: setInterval(beat, 200)};
  markHeld();
}
function jogStop(axis) {
  if (!held[axis]) return;
  clearInterval(held[axis].timer); delete held[axis]; markHeld();
  mpost("/api/mount/stop", {axis}).catch(e => { $("m_set_error").textContent = "stop: " + e.message; });
}
function stopAll() {
  for (const a in held) { clearInterval(held[a].timer); delete held[a]; }
  markHeld();
  mpost("/api/mount/stop", {}).catch(e => { $("m_set_error").textContent = "stop: " + e.message; });
}
function markHeld() {
  for (const b of document.querySelectorAll(".pad button[data-axis]"))
    b.classList.toggle("held", !!held[b.dataset.axis] && held[b.dataset.axis].dir === Number(b.dataset.dir));
}
for (const b of document.querySelectorAll(".pad button[data-axis]")) {
  const axis = b.dataset.axis, dir = Number(b.dataset.dir);
  b.addEventListener("pointerdown", e => { b.setPointerCapture(e.pointerId); jogStart(axis, dir); });
  for (const ev of ["pointerup", "pointercancel", "lostpointercapture"])
    b.addEventListener(ev, () => { if (held[axis] && held[axis].dir === dir) jogStop(axis); });
}
$("m_stop").addEventListener("click", stopAll);
window.addEventListener("blur", () => { if (Object.keys(held).length) stopAll(); });
document.addEventListener("visibilitychange", () => { if (document.hidden && Object.keys(held).length) stopAll(); });
const KEYS = {ArrowUp: ["alt", 1], ArrowDown: ["alt", -1], ArrowLeft: ["az", -1], ArrowRight: ["az", 1]};
document.addEventListener("keydown", e => {
  if ($("mount").hidden || ["INPUT", "SELECT"].includes(e.target.tagName)) return;
  if (e.key === " " || e.key === "Escape") { e.preventDefault(); stopAll(); return; }
  const k = KEYS[e.key]; if (!k) return;
  e.preventDefault(); if (!e.repeat) jogStart(k[0], k[1]);
});
document.addEventListener("keyup", e => {
  const k = KEYS[e.key]; if (k && held[k[0]] && held[k[0]].dir === k[1]) jogStop(k[0]);
});
$("m_preset").addEventListener("change", e => {
  const v = e.target.value; if (!v) return;
  $("m_speed").value = v === "max" ? Math.min(mountMax.az, mountMax.alt) : v;
  e.target.value = "";
});
$("m_cal").addEventListener("click", async () => {
  if (!confirm("Calibrate the encoder LEDs? Takes ~9 s and turns each motor slightly. Needed after every mount power-up.")) return;
  $("m_cal").disabled = true;
  try { showMount(await mpost("/api/mount/calibrate")); $("m_set_error").textContent = ""; }
  catch (e) { $("m_set_error").textContent = "calibrate: " + e.message; }
  finally { $("m_cal").disabled = false; }
});
function showMount(m) {
  mountMax = m.max_speed_dps;
  if (!$("m_speed").value) $("m_speed").value = m.default_speed_dps;
  const d = m.degrees || {}, v = m.speed_dps || {};
  list($("m_status"), {
    "az °": d.az != null ? d.az.toFixed(3) : "–", "alt °": d.alt != null ? d.alt.toFixed(3) : "–",
    "moving °/s": `az ${fmt(v.az, 3)}, alt ${fmt(v.alt, 3)}`,
    "max °/s": mountMax ? `az ${mountMax.az}, alt ${mountMax.alt}` : "–",
    calibrated: m.calibrated == null ? "–" : String(m.calibrated), busy: m.busy || "no",
  });
  const hint = m.calibrated === false
    ? "encoders not calibrated: click Calibrate encoders (needed after every mount power-up; moves are refused until then)" : "";
  $("m_error").textContent = [hint, m.error, ...(m.events || [])].filter(Boolean).join("\n");
}
async function pollMount() {
  if (!mountOn) return;
  try { showMount(await (await fetch("/api/mount")).json()); }
  catch (e) { $("m_error").textContent = "mount status: " + e; }
}
setInterval(pollMount, 500);
</script>
</body>
</html>
