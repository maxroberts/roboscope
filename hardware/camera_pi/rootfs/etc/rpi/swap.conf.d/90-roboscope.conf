# roboscope camera Pi: swap to compressed RAM (zram) only, no swap file on the SD card.
# With the default (zram + file), rpi-resize-swap-file.service runs mkswap on a 426 MiB
# /var/swap at every boot: ~21 s of the Zero's boot (measured 2026-11-25), plus SD writes.
# Deployed from the roboscope repo (hardware/camera_pi/rootfs); edit it there, not on the Pi.
[Main]
Mechanism=zram
