# roboscope camera Pi: USB Ethernet gadget options. Same file name as the
# rpi-usb-gadget package's /usr/lib/modprobe.d/g_ether.conf, so this one replaces it.
# The first five options are copied from that file (Raspberry Pi's USB IDs). Added: fixed
# MAC addresses (locally administered), so the host sees the same network interface
# every boot and always gets the same DHCP lease (see roboscope-usb-dhcp.service).
#   dev_addr  = the Pi's end (usb0)        host_addr = the host computer's end
# Deployed from the roboscope repo (hardware/camera_pi/rootfs); edit it there, not on the Pi.
options g_ether idVendor=0x2E8A idProduct=0x0013 iManufacturer="Raspberry Pi Ltd." bcdDevice=0x0100 iProduct="Raspberry Pi USB Gadget" dev_addr=02:72:62:00:00:01 host_addr=02:72:62:00:00:02
