# roboscope camera Pi: key-only SSH, no root login.
# Deployed from the roboscope repo (hardware/camera_pi/rootfs); edit it there, not on the Pi.
# sshd uses the first value it reads for each option, and reads sshd_config.d/ in name
# order, so this file (10-) overrides the Imager's 50-cloud-init.conf, which turns
# password login on.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
