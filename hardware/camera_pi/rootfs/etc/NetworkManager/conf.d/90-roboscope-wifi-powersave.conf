# roboscope camera Pi: Wi-Fi power saving off, for every Wi-Fi connection.
# Deployed from the roboscope repo (hardware/camera_pi/rootfs); edit it there, not on the Pi.
#
# With the driver's default power save on, pings to the Zero over Wi-Fi averaged
# 1,591 ms (min 258 ms, max 3.3 s) at a good -47 dBm signal. With it off: average 39 ms,
# min 5 ms (2026-11-26, hardware_findings.md). Applies to connections whose own
# 802-11-wireless.powersave is "default" (0), which includes the Imager's. 2 = disable.
# The host Pi (3B+) keeps the default.
[connection]
wifi.powersave=2
