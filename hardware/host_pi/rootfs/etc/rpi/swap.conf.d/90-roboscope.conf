# roboscope host Pi: swap to compressed RAM (zram) only, no swap file on the SD card.
# The default (zram + file) re-runs mkswap on /var/swap at every boot (~21 s on the camera
# Zero, measured 2026-11-25) and adds SD writes.
# Deployed from the roboscope repo (hardware/host_pi/rootfs); edit it there, not on the Pi.
[Main]
Mechanism=zram
