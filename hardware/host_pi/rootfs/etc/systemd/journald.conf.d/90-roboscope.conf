# roboscope host Pi: keep the journal on the SD card across reboots.
# Deployed from the roboscope repo (hardware/host_pi/rootfs); edit it there, not on the Pi.
# Pi OS ships 40-rpi-volatile-storage.conf (journal in RAM only, to spare the card);
# this later file overrides it. Without it, under-voltage events and the clues to an
# unclean reset vanish at every reboot (2026-11-26). Capped at 100 MB.
[Journal]
Storage=persistent
SystemMaxUse=100M
